[package]
name = "cli_ai"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = { version = "0.29.0", features = ["all-widgets"] }
color-eyre = "0.6"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "time"] }
anyhow = "1.0.104"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
crossterm = "0.29.0"
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
serde_json = "1.0.151"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

